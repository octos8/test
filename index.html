<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Cube</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<canvas id="cube-canvas" aria-label="드래그하여 회전하는 3D 크리스탈 큐브"></canvas>

<section class="scroll-section"></section><section class="scroll-section"></section>
