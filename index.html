
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e5e5e3" />
  <title>Glass Ribbon — 5 Scroll Experiments</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <canvas id="view" aria-label="스크롤로 움직이는 3D 글래스 리본"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <header class="top">
    <div class="logo">
      GLASS RIBBON
      <small>3D / SCROLL STUDIES</small>
    </div>
    <nav class="tabs" aria-label="스크롤 효과 선택">
      <button type="button" class="active" data-mode="unfold" aria-pressed="true">01 UNFOLD</button>
      <button type="button" data-mode="scatter" aria-pressed="false">02 SCATTER</button>
      <button type="button" data-mode="morph" aria-pressed="false">03 MORPH</button>
      <button type="button" data-mode="orbit" aria-pressed="false">04 ORBIT</button>
      <button type="button" data-mode="wire" aria-pressed="false">05 WIREFRAME</button>
    </nav>
  </header>

  <section class="palette" aria-label="리본 색상 선택">
    <span>IRIDESCENT / COLOR</span>
    <div class="palette-buttons">
      <button type="button" data-theme="opal" aria-pressed="true" class="active" style="--swatch:linear-gradient(135deg,#b6edff,#dbbaff,#fff2cf)">오팔</button>
      <button type="button" data-theme="lavender" aria-pressed="false" style="--swatch:linear-gradient(135deg,#9470ef,#e4b9ff)">라벤더</button>
      <button type="button" data-theme="aqua" aria-pressed="false" style="--swatch:linear-gradient(135deg,#36cbbb,#a5ecff)">아쿠아</button>
      <button type="button" data-theme="rose" aria-pressed="false" style="--swatch:linear-gradient(135deg,#ed87b4,#ffe0d7)">로즈</button>
      <button type="button" data-theme="gold" aria-pressed="false" style="--swatch:linear-gradient(135deg,#e2ac45,#fff2bc)">골드</button>
      <button type="button" data-theme="prism" aria-pressed="false" style="--swatch:conic-gradient(from 30deg,#f8fbff,#9bdfff,#d6b0ee,#ffe5a3,#a4e5da,#f8fbff)">프리즘</button>
    </div>
  </section>
  <div class="bottom">
    <div class="copy">
      <div class="index" id="number">EXPERIMENT / 01</div>
      <h1 id="name">Unfold</h1>
      <p id="description">서로 교차하던 리본이 부드러운 S자 곡선으로 풀립니다.</p>
    </div>
    <div class="scroll-hint">
      <span>MOVE / DRAG TO ROTATE · SCROLL TO INTERACT</span>
      <span class="scroll-icon" aria-hidden="true"></span>
    </div>
  </div>

  <div class="meter" aria-hidden="true">
    <span id="progress">000%</span>
    <div class="track"><div id="fill"></div></div>
    <span>100</span>
  </div>

  <div id="fallback" class="fallback" role="alert"></div>
  <div class="scroll-space" aria-hidden="true"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./js/script.js"></script>
</body>
</html>
