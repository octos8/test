<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Cube Scroll Interaction</title>

  <link rel="stylesheet" href="./css/style.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <canvas id="cube-canvas"></canvas>

  <main class="scroll-container">

    <section class="scroll-section">
      <div class="text">
        <span>01</span>
        <h2>STRUCTURE</h2>
        <p>구조에서 시작합니다.</p>
      </div>
    </section>

    <section class="scroll-section">
      <div class="text">
        <span>02</span>
        <h2>BREAK</h2>
        <p>구조를 분해하고 탐색합니다.</p>
      </div>
    </section>

    <section class="scroll-section">
      <div class="text">
        <span>03</span>
        <h2>ALIGN</h2>
        <p>요소를 다시 정렬합니다.</p>
      </div>
    </section>

    <section class="scroll-section">
      <div class="text">
        <span>04</span>
        <h2>QUESTION</h2>
        <p>왜 이 요소가 여기에 있어야 하는가?</p>
      </div>
    </section>

  </main>

  <script type="module" src="./js/cube-scroll.js"></script>
</body>
</html>
